    <script>
      (function() {
        try {
          var saved = localStorage.getItem('syllabus3d_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            // Default to dark mode
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
