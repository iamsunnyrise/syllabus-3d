<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixed Prepositions Mastery | शब्दों के साथ प्रयुक्त उपयुक्त Prepositions (335+ Complete Notes)</title>
  
  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="vendor/lucide.min.js"></script>
  
  <style>
    :root {
      --bg-primary: #090d16;
      --bg-secondary: #111827;
      --bg-card: #1e293b;
      --bg-card-hover: #273549;
      --border-color: #334155;
      
      --accent-primary: #06b6d4;
      --accent-secondary: #8b5cf6;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-hindi: #fef08a;
      
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 14px 28px -5px rgba(0, 0, 0, 0.4);
      
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --border-color: #e2e8f0;
      
      --accent-primary: #0891b2;
      --accent-secondary: #7c3aed;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-hindi: #9a3412;
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      box-sizing: border-box;
      padding-bottom: 70px;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }

    .app-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 20px 40px;
      box-sizing: border-box;
    }

    /* HEADER BANNER */
    .header-banner {
      background: linear-gradient(135deg, #0e7490 0%, #1e1b4b 60%, #312e81 100%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    [data-theme="light"] .header-banner {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdfa 50%, #ede9fe 100%);
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
    }

    .brand-text h1 {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-text p {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .btn-action:hover {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }

    .stats-ribbon {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: var(--transition);
    }
    .stat-box:hover {
      border-color: var(--accent-primary);
      transform: translateY(-2px);
    }
    [data-theme="light"] .stat-box {
      background: rgba(241, 245, 249, 0.85);
      border-color: #e2e8f0;
    }
    .stat-num {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* TABS */
    .category-tabs {
      display: flex;
      gap: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: var(--shadow-sm);
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .tab-btn {
      flex: 1;
      min-width: 140px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab-btn:hover {
      border-color: var(--accent-primary);
      color: var(--text-main);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.4);
    }

    /* CONTROLS */
    .controls-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-sm);
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .search-wrapper {
      flex: 1;
      min-width: 220px;
      max-width: 100%;
      position: relative;
    }
    .search-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
      transition: var(--transition);
      box-sizing: border-box;
    }
    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }

    /* CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .cards-grid { grid-template-columns: minmax(0, 1fr) !important; gap: 12px; }
      .app-container { padding: 10px 10px 90px; }
      .brand-text h1 { font-size: 18px; }
      .controls-panel { padding: 12px 10px; margin-bottom: 16px; gap: 10px; }
      .search-wrapper { min-width: 0; width: 100%; }
      .prep-card { padding: 14px 12px; gap: 10px; }
    }

    .prep-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      position: relative;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      overflow: hidden;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .prep-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(6, 182, 212, 0.5);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .word-title {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .prep-highlight {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-primary);
      padding: 2px 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 15px;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .cat-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .cat-noun { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .cat-adjective { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
    .cat-verb { background: rgba(16, 185, 129, 0.15); color: #34d399; }

    .hindi-meaning {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-hindi);
      background: rgba(254, 240, 138, 0.08);
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-amber);
    }
    [data-theme="light"] .hindi-meaning {
      background: rgba(217, 119, 6, 0.08);
      color: var(--text-hindi);
    }

    .example-box {
      font-size: 14px;
      color: var(--text-main);
      background: var(--bg-card);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      line-height: 1.5;
    }
    .example-box strong {
      color: var(--accent-primary);
      text-decoration: underline;
    }

    .exam-tip-box {
      font-size: 12.5px;
      color: var(--text-muted);
      background: rgba(139, 92, 246, 0.08);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px dashed rgba(139, 92, 246, 0.4);
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .exam-tip-box i {
      color: var(--accent-secondary);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 8px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      color: var(--accent-primary);
      background: var(--bg-card);
    }
    .icon-btn.active-fav {
      color: #f59e0b;
    }

    /* PRACTICE QUIZ MODAL */
    .quiz-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .quiz-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      max-width: 650px;
      width: 100%;
      padding: 28px;
      box-shadow: var(--shadow-lg);
    }
    .quiz-opt-btn {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      margin-bottom: 10px;
      transition: var(--transition);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quiz-opt-btn:hover {
      border-color: var(--accent-primary);
      background: var(--bg-card-hover);
    }
    .quiz-opt-btn.correct {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: var(--accent-emerald) !important;
      color: #34d399 !important;
    }
    .quiz-opt-btn.wrong {
      background: rgba(244, 63, 94, 0.2) !important;
      border-color: var(--accent-rose) !important;
      color: #fb7185 !important;
    }

    /* TOAST */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--accent-primary);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast-msg.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- HEADER -->
  <header class="header-banner">
    <div class="top-nav">
      <div class="brand">
        <div class="brand-icon">
          <i data-lucide="compass" style="width:28px;height:28px;"></i>
        </div>
        <div class="brand-text">
          <h1>Words Followed by Different Prepositions</h1>
          <p>Complete Notes (335 Fixed Preposition Pairs) • Pure Hindi Meanings & Exam Tips</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-action" onclick="toggleTheme()">
          <i data-lucide="moon" id="themeIcon"></i> <span id="themeText">Dark</span>
        </button>
        <button class="btn-action" onclick="startQuiz()">
          <i data-lucide="play-circle"></i> Practice Quiz
        </button>
        <button class="btn-action" onclick="window.print()">
          <i data-lucide="printer"></i> Print
        </button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-ribbon">
      <div class="stat-box" onclick="filterCategory('all')">
        <i data-lucide="layers" style="color:var(--accent-primary);"></i>
        <div>
          <div class="stat-num">335</div>
          <div class="stat-label">Total Pairs</div>
        </div>
      </div>
      <div class="stat-box" onclick="filterCategory('noun')">
        <i data-lucide="hash" style="color:#38bdf8;"></i>
        <div>
          <div class="stat-num">54</div>
          <div class="stat-label">1. Noun + Prep</div>
        </div>
      </div>
      <div class="stat-box" onclick="filterCategory('adjective')">
        <i data-lucide="sparkles" style="color:#c084fc;"></i>
        <div>
          <div class="stat-num">112</div>
          <div class="stat-label">2. Adjective + Prep</div>
        </div>
      </div>
      <div class="stat-box" onclick="filterCategory('verb')">
        <i data-lucide="zap" style="color:#34d399;"></i>
        <div>
          <div class="stat-num">169</div>
          <div class="stat-label">3. Verb + Prep</div>
        </div>
      </div>
      <div class="stat-box">
        <i data-lucide="bookmark" style="color:#f59e0b;"></i>
        <div>
          <div class="stat-num" id="favCount">0</div>
          <div class="stat-label">Bookmarked</div>
        </div>
      </div>
    </div>
  </header>

  <!-- CATEGORY TABS -->
  <nav class="category-tabs">
    <button class="tab-btn active" id="tab-all" onclick="filterCategory('all')">
      <i data-lucide="layers"></i> All (335)
    </button>
    <button class="tab-btn" id="tab-noun" onclick="filterCategory('noun')">
      <i data-lucide="hash"></i> 1. Nouns (54)
    </button>
    <button class="tab-btn" id="tab-adjective" onclick="filterCategory('adjective')">
      <i data-lucide="sparkles"></i> 2. Adjectives & Participles (112)
    </button>
    <button class="tab-btn" id="tab-verb" onclick="filterCategory('verb')">
      <i data-lucide="zap"></i> 3. Verbs (169)
    </button>
  </nav>

  <!-- CONTROLS & SEARCH -->
  <section class="controls-panel">
    <div class="search-row">
      <div class="search-wrapper">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by word, preposition (e.g. 'agree', 'of', 'with', 'for'), Hindi meaning..." oninput="handleSearch()">
      </div>
      <button class="btn-action" onclick="showOnlyBookmarks()">
        <i data-lucide="bookmark"></i> View Bookmarked
      </button>
      <button class="btn-action" onclick="resetFilters()">
        <i data-lucide="rotate-ccw"></i> Reset Filters
      </button>
    </div>
  </section>

  <!-- CARDS CONTAINER -->
  <main id="cardsContainer" class="cards-grid"></main>
</div>

<!-- QUIZ MODAL -->
<div id="quizModal" class="quiz-modal">
  <div class="quiz-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
      <span style="font-size:13px; font-weight:700; color:var(--accent-primary);" id="quizCounter">Question 1 of 10</span>
      <button class="icon-btn" onclick="closeQuiz()"><i data-lucide="x"></i></button>
    </div>
    <div style="font-size:17px; font-weight:700; margin-bottom:14px;" id="quizQuestion">Fill in the blank with the correct preposition:</div>
    <div id="quizOptions"></div>
    <div id="quizFeedback" style="display:none; margin-top:16px; padding:12px; border-radius:8px; font-size:13.5px;"></div>
    <div style="display:flex; justify-content:flex-end; margin-top:20px;">
      <button class="btn-action" id="quizNextBtn" style="display:none;" onclick="nextQuizQuestion()">Next Question <i data-lucide="arrow-right"></i></button>
    </div>
  </div>
</div>

<script>

ar to me. He is not familiar with this kind of concept.","examTip":"Subject is thing -> Familiar to person; Subject is person -> Familiar with subject."},{"category":"adjective","word":"Famous","prep":"for","pair":"Famous for","hindi":"के लिए प्रसिद्ध / विख्यात","example":"He is famous for his deeds.","examTip":"Famous for tourist spots / bravery."},{"category":"adjective","word":"Fit","prep":"for","pair":"Fit for","hindi":"के लिए उपयुक्त / योग्य","example":"Is he fit for this job?","examTip":"Fit for consumption / service."},{"category":"adjective","word":"Fond","prep":"of","pair":"Fond of","hindi":"का शौकीन / प्रेमी","example":"The boy is fond of cricket.","examTip":"Fond of sweets / music."},{"category":"adjective","word":"Free","prep":"from","pair":"Free from","hindi":"से मुक्त / रहित","example":"No magazine is free from errors.","examTip":"Free from danger / guilt / pain."},{"category":"adjective","word":"Full","prep":"of","pair":"Full of","hindi":"से लबालब भरा हुआ","example":"This box is full of clothes.","examTip":"Full of water / optimism (not 'full with')."},{"category":"adjective","word":"Glad","prep":"of","pair":"Glad of","hindi":"पर प्रसन्न / खुश","example":"He is glad of your success.","examTip":"Glad of the opportunity / victory."},{"category":"adjective","word":"Good","prep":"at / for","pair":"Good at / for","hindi":"में निपुण (at) / स्वास्थ्य के लिए अच्छा (for)","example":"He is good at English. This medicine is good for health.","examTip":"Good at mathematics / chess (कौशल); Good for digestion / heart (लाभकारी)।"},{"category":"adjective","word":"Greedy","prep":"for","pair":"Greedy for","hindi":"का लालची / भूखा","example":"They are greedy for wealth.","examTip":"Greedy for fame / money."},{"category":"adjective","word":"Guilty","prep":"of","pair":"Guilty of","hindi":"का दोषी / मुजरिम","example":"He is guilty of murder.","examTip":"Guilty of a crime (never 'guilty for')."},{"category":"adjective","word":"Honest","prep":"in","pair":"Honest in","hindi": ategory":"verb","word":"Abide","prep":"by","pair":"Abide by","hindi":"वचन या नियम का निष्ठा से पालन करना","example":"You must abide by your promise.","examTip":"Abide by the law / rules / promise."},{"category":"verb","word":"Abound","prep":"with / in","pair":"Abound with / in","hindi":"प्रचुर मात्रा में भरा होना","example":"The pond abounded with fish. Fish abounded in the pond.","examTip":"Place abounds with things; Things abound in place."},{"category":"verb","word":"Abstain","prep":"from","pair":"Abstain from","hindi":"से परहेज करना / दूर रहना","example":"I abstain from smoking.","examTip":"Abstain from alcohol / voting."},{"category":"verb","word":"Accede","prep":"to","pair":"Accede to","hindi":"प्रार्थना या मांग स्वीकार करना","example":"The manager acceded to my request.","examTip":"Accede to a request / proposal."},{"category":"verb","word":"Acquit","prep":"of","pair":"Acquit of","hindi":"आरोप से बरी करना","example":"The judge acquitted him of the murder.","examTip":"Acquit someone of charges."},{"category":"verb","word":"Act","prep":"from","pair":"Act from","hindi":"भावना या भय से प्रेरित होकर कार्य करना","example":"He acted from fear.","examTip":"Act from fear / greed / malice."},{"category":"verb","word":"Admit","prep":"of","pair":"Admit of","hindi":"की गुंजाइश होना","example":"Your conduct admits of no excuse.","examTip":"Admit of no doubt / excuse (गुंजाइश होना)।"},{"category":"verb","word":"Agree","prep":"with / to","pair":"Agree with (person) / to (proposal)","hindi":"सहमत होना","example":"I agree with you on this point. I agree to your proposal.","examTip":"Agree with a person; Agree to a proposal/terms; Agree on a point."},{"category":"verb","word":"Aim","prep":"at","pair":"Aim at","hindi":"निशाना लगाना / लक्ष्य रखना","example":"All of us aim at betterment.","examTip":"Aim at winning / aim at the target."},{"category":"verb","word":"Apologize","prep":"to / for","pair":"Apologize to (person) / for (mistake)","hindi":"माफी मांगना","example":"I apologize to you for my mistake.","examTip":"Apologize to someone for something."},{"category":"verb","word":"Appeal","prep":"to","pair":"Appeal to","hindi":"से गुहार लगाना / अपील करना","example":"They appealed to her for mercy.","examTip":"Appeal to someone for something."},{"category":"verb","word":"Appoint","prep":"to","pair":"Appoint to","hindi":"पद पर नियुक्त करना","example":"A doctor was appointed to the post.","examTip":"Appointed to a position."},{"category":"verb","word":"Arrive","prep":"at / in","pair":"Arrive at / in","hindi":"पहुंचना","example":"We arrived at the station on time. Arrive in London next week.","examTip":"Arrive at small places (station, airport); Arrive in big cities / countries."},{"category":"verb","word":"Attend","prep":"to / upon","pair":"Attend to / upon","hindi":"ध्यान देना (to) / सेवा करना (upon)","example":"You must attend to your lessons. He has many servants attending upon him.","examTip":"Attend to duties/orders; Attend upon a sick person."},{"category":"verb","word":"Avail","prep":"of","pair":"Avail of","hindi":"का लाभ उठाना (Reflexive Pronoun के साथ)","example":"You should avail yourself of the opportunity.","examTip":"Grammar Rule: Avail + Reflexive Pronoun + of."},{"category":"verb","word":"Avenge","prep":"on","pair":"Avenge on","hindi":"से बदला लेना","example":"He avenged himself on his enemies.","examTip":"Avenge oneself on someone."},{"category":"verb","word":"Bear","prep":"with","pair":"Bear with","hindi":"सहन करना / बर्दाश्त करना","example":"I cannot bear with your weakness.","examTip":"Bear with my bad handwriting / temper."},{"category":"verb","word":"Beat","prep":"against","pair":"Beat against","hindi":"से टकराना","example":"The waves can be seen beating against the rocks.","examTip":"Rain / waves beating against windows or rocks."},{"category":"verb","word":"Beg","prep":"of","pair":"Beg of","hindi":"से याचना करना","example":"I begged pardon of her.","examTip":"Beg a favor of someone."},{"category":"verb","word":"Believe","prep":"in","pair":"Believe in","hindi":"में आस्था या विश्वास रखना","example":"I do not believe in God.","examTip":"Believe in democracy / God / truth."},{"category":"verb","word":"Bestow","prep":"on","pair":"Bestow on","hindi":"को अर्पित करना / प्रदान करना","example":"God bestowed this world on us.","examTip":"Bestow honors on a person."},{"category":"verb","word":"Beware","prep":"of","pair":"Beware of","hindi":"से सतर्क / सावधान रहना","example":"Beware of dogs.","examTip":"Beware of pickpockets / dogs."},{"category":"verb","word":"Blame","prep":"for","pair":"Blame for","hindi":"के लिए दोष मढ़ना","example":"He blamed me for his failure.","examTip":"Blame someone for something."},{"category":"verb","word":"Boast","prep":"of","pair":"Boast of","hindi":"की डींग हांकना / घमंड करना","example":"She boasts of her success.","examTip":"Boast of wealth / accomplishments."},{"category":"verb","word":"Borrow","prep":"from","pair":"Borrow from","hindi":"से उधार लेना","example":"He borrowed some money from me.","examTip":"Borrow from a bank / friend."},{"category":"verb","word":"Break","prep":"into","pair":"Break into","hindi":"जबरन घुसना / सेंधमारी करना","example":"A stranger broke into my house at night.","examTip":"Break into a building."},{"category":"verb","word":"Brood","prep":"over","pair":"Brood over","hindi":"पर गहराई से चिंता करते रहना","example":"You should not brood over the past.","examTip":"Brood over losses / failure."},{"category":"verb","word":"Call","prep":"on / to / for","pair":"Call on / to / for","hindi":"मुलाकात करना (on) / पुकारना (to) / मांग करना (for)","example":"We called on him yesterday. She called to me for help. The situation calls for immediate care.","examTip":"Call on a person; Call at a place; Call for explanation."},{"category":"verb","word":"Care","prep":"for","pair":"Care for","hindi":"की परवाह करना / पसंद करना","example":"I do not care for his comment.","examTip":"Care for someone's opinion."},{"category":"verb","word":"Charge","prep":"with","pair":"Charge with","hindi":"आरोप लगाना","example":"I was charged with theft.","examTip":"Charge someone with murder."},{"category":"verb","word":"Come","prep":"across","pair":"Come across","hindi":"अचानक मिल जाना","example":"I came across my friend at the mall.","examTip":"Never use 'suddenly' with 'come across'."},{"category":"verb","word":"Compare","prep":"with / to","pair":"Compare with / to","hindi":"तुलना करना (with) / रूपक देना (to)","example":"I compared the strength of Mohit with that of Mangal. Anger may be compared to fire.","examTip":"Similar things -> compare with; Dissimilar things (metaphor) -> compare to."},{"category":"verb","word":"Compete","prep":"with","pair":"Compete with","hindi":"से मुकाबला / प्रतिस्पर्धा करना","example":"He competed with us for the award.","examTip":"Compete with someone for something."},{"category":"verb","word":"Complain","prep":"of / about / against","pair":"Complain of / about / against","hindi":"शिकायत करना","example":"She complained to me of his misconduct. He never complains against me.","examTip":"Complain to a person; Complain of/about something; Complain against someone."},{"category":"verb","word":"Comply","prep":"with","pair":"Comply with","hindi":"नियमों का अनुपालन करना","example":"I complied with the norms of the organization.","examTip":"Comply with regulations / rules."},{"category":"verb","word":"Confer","prep":"on","pair":"Confer on","hindi":"उपाधि या पुरस्कार से सम्मानित करना","example":"An award was conferred on him.","examTip":"Confer an honor on someone."},{"category":"verb","word":"Confide","prep":"in / to","pair":"Confide in / to","hindi":"भरोसा करना (in) / गुप्त बात बताना (to)","example":"She confided in him. He confided his secrets to us.","examTip":"Confide in a trustworthy friend; Confide a secret to someone."},{"category":"verb","word":"Congratulate","prep":"on","pair":"Congratulate on","hindi":"पर बधाई देना","example":"He congratulated me on my success.","examTip":"Congratulate someone on an achievement (never 'for')."},{"category":"verb","word":"Consist","prep":"of / in","pair":"Consist of / in","hindi":"से मिलकर बनना (of) / में निहित होना (in)","example":"The book consists of ten chapters. The happiness of a country consists in the freedom of its citizens.","examTip":"Physical parts -> Consist of; Abstract quality -> Consist in."},{"category":"verb","word":"Convict","prep":"of","pair":"Convict of","hindi":"दोषी सिद्ध करना","example":"The judge convicted him of the murder.","examTip":"Convict of fraud / treason."},{"category":"verb","word":"Cure","prep":"of","pair":"Cure of","hindi":"रोग से छुटकारा दिलाना","example":"No medicine can cure him of his disease.","examTip":"Cure a patient of asthma."},{"category":"verb","word":"Deal","prep":"in / with","pair":"Deal in / with","hindi":"व्यापार करना (in) / निपटना या व्यवहार करना (with)","example":"My father deals in shoes. Who will deal with them?","examTip":"Deal in commodities (sugar, cloth); Deal with people or difficult problems."},{"category":"verb","word":"Defend","prep":"from / against","pair":"Defend from / against","hindi":"से रक्षा या बचाव करना","example":"He defended her from the charges.","examTip":"Defend the country against aggression."},{"category":"verb","word":"Deposit","prep":"in / with","pair":"Deposit in / with","hindi":"जमा करना","example":"He deposited money in the bank. He deposited documents with the manager.","examTip":"Deposit in an account / with an authority."},{"category":"verb","word":"Deprive","prep":"of","pair":"Deprive of","hindi":"से वंचित करना / छीन लेना","example":"I am deprived of these facilities.","examTip":"Deprive of human rights / privileges."},{"category":"verb","word":"Derive","prep":"from","pair":"Derive from","hindi":"से प्राप्त करना / उत्पन्न होना","example":"He derived pleasure from one's pain.","examTip":"Derive joy / words derived from Latin."},{"category":"verb","word":"Despair","prep":"of","pair":"Despair of","hindi":"की उम्मीद छोड़ देना / निराश होना","example":"You should not be despaired of success.","examTip":"Despair of a recovery / success."},{"category":"verb","word":"Die","prep":"of / from","pair":"Die of (disease) / from (external cause)","hindi":"मरना","example":"He died of cancer. He died from overwork.","examTip":"Die of illness / hunger / grief; Die from a wound / poison / overwork."},{"category":"verb","word":"Differ","prep":"with / from","pair":"Differ with (person) / from (thing)","hindi":"मतभेद रखना (with) / अलग होना (from)","example":"I differ with you at this point. This book differs from that.","examTip":"Differ with a person in opinion; Differ from another item in appearance."},{"category":"verb","word":"Dispose","prep":"of","pair":"Dispose of","hindi":"निपटाना / बेच देना (Single 'f')","example":"He has disposed of all his property.","examTip":"Common Error: Exam में 'dispose off' दिया जाता है, सही 'dispose of' है।"},{"category":"verb","word":"Dissuade","prep":"from","pair":"Dissuade from","hindi":"रोकना / सलाह देकर विमुख करना","example":"He dissuaded me from joining the army.","examTip":"Dissuade someone from + Gerund."},{"category":"verb","word":"Distinguish","prep":"from","pair":"Distinguish from","hindi":"के बीच अंतर पहचानना","example":"You cannot distinguish truth from falsehood.","examTip":"Distinguish A from B."},{"category":"verb","word":"Dream","prep":"of","pair":"Dream of","hindi":"का सपना देखना","example":"He dreamt of becoming a doctor.","examTip":"Dream of fame / success."},{"category":"verb","word":"End","prep":"in","pair":"End in","hindi":"में समाप्त होना / परिणत होना","example":"His efforts ended in failure.","examTip":"End in smoke (मुहावरा - व्यर्थ साबित होना) / end in disaster."},{"category":"verb","word":"Enter","prep":"into / upon","pair":"Enter into / upon","hindi":"चर्चा शुरू करना (into) / नया करियर शुरू करना (upon)","example":"He entered into the discussion. Rajani has entered upon a new career.","examTip":"Physical room/building में प्रवेश के लिए 'enter' के साथ कोई Preposition नहीं आता!"},{"category":"verb","word":"Exchange","prep":"for","pair":"Exchange for","hindi":"के बदले बदलना","example":"He exchanged the bike for the car.","examTip":"Exchange A for B."},{"category":"verb","word":"Explain","prep":"to","pair":"Explain to","hindi":"को समझाना","example":"He could not explain this question to me.","examTip":"Explain something to someone."},{"category":"verb","word":"Export","prep":"from","pair":"Export from","hindi":"से निर्यात करना","example":"Various things are exported from India.","examTip":"Export from a nation into another."},{"category":"verb","word":"Fall","prep":"upon","pair":"Fall upon","hindi":"पर अचानक टूट पड़ना / आक्रमण करना","example":"The robbers fell upon the merchant.","examTip":"Fall upon enemies."},{"category":"verb","word":"Feed","prep":"on","pair":"Feed on","hindi":"खाकर जीवन यापन करना","example":"Most animals feed on grass.","examTip":"Feed on grains / grass."},{"category":"verb","word":"Feel","prep":"for","pair":"Feel for","hindi":"के प्रति संवेदना महसूस करना","example":"She felt for me in my trouble.","examTip":"Feel for the helpless."},{"category":"verb","word":"Fight","prep":"with / against / for","pair":"Fight with / against / for","hindi":"से लड़ना / के लिए संघर्ष करना","example":"We have to fight against corruption. They were fighting for their independence.","examTip":"Fight for rights; Fight against evil."},{"category":"verb","word":"Fly","prep":"at / into","pair":"Fly at / into","hindi":"पर झपटना (at) / क्रोध में बेकाबू होना (into)","example":"The vulture flew at the dead body. She flew into a rage to see me.","examTip":"Fly into a passion / rage."},{"category":"verb","word":"Furnish","prep":"with","pair":"Furnish with","hindi":"से सुसज्जित करना / उपलब्ध कराना","example":"They furnished the library with books.","examTip":"Furnish someone with information / goods."},{"category":"verb","word":"Get","prep":"at / on / over / to / out of","pair":"Get at / on / over / to","hindi":"सच्चाई तक पहुंचना / उन्नति करना / उबरना","example":"We shall get at the facts. I hope you will get on well. My mother got over her illness.","examTip":"Get at (reach facts); Get on (progress); Get over (recover from illness)."},{"category":"verb","word":"Grieve","prep":"at / about / for / over","pair":"Grieve at / about / for / over","hindi":"पर गहरा शोक मनाना","example":"My parents grieved at the news. Don't grieve for the dead.","examTip":"Grieve for a person; Grieve over an irreparable loss."},{"category":"verb","word":"Grumble","prep":"at","pair":"Grumble at","hindi":"पर बड़बड़ाना / असंतोष जताना","example":"She is always grumbling at her misfortune.","examTip":"Grumble at bad weather / fate."},{"category":"verb","word":"Guard","prep":"against","pair":"Guard against","hindi":"से बचाव रखना / सावधान रहना","example":"They must guard against the enemy attack.","examTip":"Guard against mistakes / infection."},{"category":"verb","word":"Hear","prep":"about / of / from","pair":"Hear about / of / from","hindi":"के बारे में सुनना / समाचार मिलना","example":"Have you heard of Gandhi? I have not heard from her for a long time.","examTip":"Hear from a person (पत्र या संदेश मिलना); Hear of/about someone (अस्तित्व या घटना की जानकारी होना)।"},{"category":"verb","word":"Hide","prep":"from","pair":"Hide from","hindi":"से छिपाना","example":"You need not hide the truth from your parents.","examTip":"Hide something from someone."},{"category":"verb","word":"Hinder","prep":"from","pair":"Hinder from","hindi":"कार्य करने से रोकना / बाधा डालना","example":"Nothing hindered me from taking this action.","examTip":"Hinder someone from + Gerund."},{"category":"verb","word":"Hope","prep":"for","pair":"Hope for","hindi":"की उम्मीद / आशा करना","example":"Let's hope for the best.","examTip":"Hope for success / better days."},{"category":"verb","word":"Import","prep":"from / into","pair":"Import from ... into","hindi":"से आयात करना","example":"Foodstuffs are imported from America into India.","examTip":"Import from a country into another."},{"category":"verb","word":"Impress","prep":"on","pair":"Impress on","hindi":"के महत्व को मन में बिठाना","example":"I impressed on the importance of cleanliness.","examTip":"Impress an idea on someone."},{"category":"verb","word":"Impute","prep":"to","pair":"Impute to","hindi":"का दोष मढ़ना / जिम्मेदार ठहराना","example":"Do not impute my silence to unfriendliness.","examTip":"Impute motives to someone."},{"category":"verb","word":"Infer","prep":"from","pair":"Infer from","hindi":"से निष्कर्ष निकालना","example":"You can infer from my remarks that you are a cunning fellow.","examTip":"Infer a conclusion from evidence."},{"category":"verb","word":"Infest","prep":"with","pair":"Infest with","hindi":"से भर जाना (कीटों/चूहों से)","example":"My store-room is infested with rats.","examTip":"Infested with cockroaches / pests."},{"category":"verb","word":"Inform","prep":"of / against","pair":"Inform of / against","hindi":"सूचित करना (of) / चुगली या शिकायत करना (against)","example":"Have you informed him of your arrival? Who has informed the police against me?","examTip":"Inform someone of an event; Inform against a criminal."},{"category":"verb","word":"Enquire","prep":"into / of","pair":"Enquire into / of","hindi":"मामले की जांच करना (into) / व्यक्ति से पूछना (of)","example":"The police are enquiring into the matter. He enquired of me why I had done so.","examTip":"Enquire into a case; Enquire of a person; Enquire after health."},{"category":"verb","word":"Insist","prep":"on","pair":"Insist on","hindi":"पर अड़ना / ज़ोर देना","example":"He insisted on my going there.","examTip":"Insist on + Possessive Adjective + Gerund (e.g. insisted on my going)."},{"category":"verb","word":"Interfere","prep":"in / with","pair":"Interfere in / with","hindi":"मामले में टांग अड़ाना / बाधा डालना","example":"You cannot interfere in my business. He interfered with me in my private matters.","examTip":"Interfere in affairs; Interfere with rights."},{"category":"verb","word":"Invite","prep":"to","pair":"Invite to","hindi":"को आमंत्रित करना","example":"I have invited her to dinner.","examTip":"Invite to lunch / tea / wedding (never 'invite for')."},{"category":"verb","word":"Jeer","prep":"at","pair":"Jeer at","hindi":"का उपहास उड़ाना / ताना मारना","example":"Don't jeer at your friend.","examTip":"Jeer at the speaker."},{"category":"verb","word":"Jest","prep":"about","pair":"Jest about","hindi":"का मज़ाक बनाना","example":"Don't jest about serious things.","examTip":"Jest about sacred matters."},{"category":"verb","word":"Join","prep":"in / to","pair":"Join in / to","hindi":"में शामिल होना (in) / से जोड़ना (to)","example":"You should join in the discussion. Join this to that.","examTip":"Join in an activity; Join one point to another."},{"category":"verb","word":"Jump","prep":"at / to","pair":"Jump at / to","hindi":"अवसर पर लपकना (at) / जल्दबाज़ी में निष्कर्ष निकालना (to)","example":"Rohit jumped at the offer at once. He jumped to the conclusion that it cannot be done.","examTip":"Jump at an offer; Jump to a conclusion."},{"category":"verb","word":"Keep","prep":"from / to","pair":"Keep from / to","hindi":"से दूर रहना (from) / पर बने रहना (to)","example":"Keep away from smoking. Keep to the left.","examTip":"Keep from bad company; Keep to rules."},{"category":"verb","word":"Kick","prep":"against / at","pair":"Kick against / at","hindi":"विद्रोह करना (against) / ठुकराना (at)","example":"Do not kick against authority. You should not kick at his offer.","examTip":"Kick against authority / kick at an opportunity."},{"category":"verb","word":"Knock","prep":"at","pair":"Knock at","hindi":"पर दस्तक देना","example":"He knocked at my door.","examTip":"Knock at the door."},{"category":"verb","word":"Labour","prep":"for","pair":"Labour for","hindi":"के लिए कठोर परिश्रम करना","example":"All his life he laboured for the welfare of people.","examTip":"Labour for peace / public good."},{"category":"verb","word":"Lack","prep":"in","pair":"Lack in","hindi":"में कमी होना (Passive/Adjective usage)","example":"You are lacking in certain qualities.","examTip":"Active Verb takes NO preposition: 'He lacks courage'."},{"category":"verb","word":"Lament","prep":"for","pair":"Lament for","hindi":"के लिए विलाप करना","example":"Do not lament for the one who is no more.","examTip":"Lament for the dead."},{"category":"verb","word":"Land","prep":"at","pair":"Land at","hindi":"पर उतरना","example":"We landed at the Delhi airport.","examTip":"Land at the port / runway."},{"category":"verb","word":"Laugh","prep":"at","pair":"Laugh at","hindi":"पर हँसना / खिल्ली उड़ाना","example":"They laughed at me.","examTip":"Laugh at someone's plight."},{"category":"verb","word":"Lay","prep":"before / to / under","pair":"Lay before / to / under","hindi":"समक्ष रखना / मढ़ना / उपकृत करना","example":"He laid all the facts before the magistrate. You have not laid me under your gratitude.","examTip":"Lay facts before a committee."},{"category":"verb","word":"Lead","prep":"to","pair":"Lead to","hindi":"की ओर ले जाना / परिणाम निकालना","example":"This road leads to the college. Hard work leads to success.","examTip":"Lead to prosperity / disaster."},{"category":"verb","word":"Lean","prep":"to / against","pair":"Lean to / against","hindi":"की तरफ झुकना / का सहारा लेना","example":"If you lean to his side, fair decision cannot be taken.","examTip":"Lean against a wall; Lean to an opinion."},{"category":"verb","word":"Leap","prep":"at","pair":"Leap at","hindi":"अवसर को लपकना","example":"You must leap at the opportunity.","examTip":"Leap at an offer."},{"category":"verb","word":"Learn","prep":"of","pair":"Learn of","hindi":"के बारे में जानकारी मिलना","example":"I am delighted to learn of her success.","examTip":"Learn of someone's appointment."},{"category":"verb","word":"Level","prep":"with","pair":"Level with","hindi":"जमीन पर गिरा देना / बराबर करना","example":"She levelled him with one punch.","examTip":"Level with the ground."},{"category":"verb","word":"Listen","prep":"to","pair":"Listen to","hindi":"को ध्यान से सुनना","example":"Listen to this song. Always listen to your teacher.","examTip":"Never omit 'to' after listen (not 'listen him')."},{"category":"verb","word":"Live","prep":"within / by / on","pair":"Live within / by / on","hindi":"साधनों में रहना / कमाई से जीना","example":"You should learn how to live within your means. Very few like to live by honest labour.","examTip":"Live within means; Live by honest work; Live on rice/milk."},{"category":"verb","word":"Look","prep":"at / after / into / for","pair":"Look at / after","hindi":"देखना (at) / देखभाल करना (after)","example":"He was looking at me. You have to look after his children.","examTip":"Look at (direct eyes); Look after (take care); Look into (investigate); Look for (search)."},{"category":"verb","word":"Meddle","prep":"in / with","pair":"Meddle in / with","hindi":"मामले में दखल देना / छेड़छाड़ करना","example":"You have no right to meddle in my affairs. Somebody must be meddling with my papers.","examTip":"Meddle in affairs; Meddle with property/papers."},{"category":"verb","word":"Meet","prep":"with","pair":"Meet with","hindi":"दुर्घटना या अप्रिय घटना का सामना होना","example":"I met with an accident last night.","examTip":"Meet with an accident/obstacle; Meet a friend (no preposition for persons)."},{"category":"verb","word":"Mix","prep":"with","pair":"Mix with","hindi":"के साथ मिलाना / घुलना-मिलना","example":"You cannot mix it with milk.","examTip":"Oil does not mix with water."},{"category":"verb","word":"Mourn","prep":"for / over","pair":"Mourn for / over","hindi":"के लिए शोक मनाना","example":"Do not mourn for the dead. The country mourned over the loss.","examTip":"Mourn for the departed; Mourn over a loss."},{"category":"verb","word":"Murmur","prep":"against / at","pair":"Murmur against / at","hindi":"के खिलाफ बड़बड़ाना / असंतोष जताना","example":"They are murmuring against new laws. They murmured at injustice.","examTip":"Murmur against an authority."},{"category":"verb","word":"Object","prep":"to","pair":"Object to","hindi":"पर आपत्ति उठाना","example":"He objects to my going there.","examTip":"Object to + Possessive + Gerund."},{"category":"verb","word":"Occur","prep":"to","pair":"Occur to","hindi":"दिमाग में विचार आना","example":"It did not occur to me at all.","examTip":"An idea occurred to him."},{"category":"verb","word":"Originate","prep":"in","pair":"Originate in","hindi":"से उद्गम होना / उत्पन्न होना","example":"The Ganga originates in the Himalayas.","examTip":"Originate in a mountain range."},{"category":"verb","word":"Part","prep":"with / from","pair":"Part with (things) / from (persons)","hindi":"से अलग होना / बिछड़ना","example":"She parted with all her money. I don't want to part from my parents.","examTip":"Very High Frequency: Part with money/possessions; Part from loved ones."},{"category":"verb","word":"Partake","prep":"of","pair":"Partake of","hindi":"भोजन आदि ग्रहण करना / साझा करना","example":"He partook of the lunch.","examTip":"Partake of food/refreshments."},{"category":"verb","word":"Perish","prep":"with","pair":"Perish with","hindi":"भूख या ठंड से नष्ट होना / मरना","example":"Many beggars perish with cold and hunger.","examTip":"Perish with hunger/frost."},{"category":"verb","word":"Persevere","prep":"in","pair":"Persevere in","hindi":"कठिनाइयों के बावजूद लगे रहना","example":"You should persevere in your research.","examTip":"Persevere in efforts."},{"category":"verb","word":"Persist","prep":"in","pair":"Persist in","hindi":"पर अड़े रहना / ज़िद जारी रखना","example":"He persisted in doing this work.","examTip":"Persist in + Gerund (e.g. persist in making noise)."},{"category":"verb","word":"Pine","prep":"for","pair":"Pine for","hindi":"के लिए तड़पना / तरसना","example":"She pined for success and love.","examTip":"Pine for lost days / loved ones."},{"category":"verb","word":"Play","prep":"with / on","pair":"Play with / on","hindi":"से खिलवाड़ करना (with) / चेहरे पर झलकना (on)","example":"Don't play with fireworks. A faint smile played on her lips.","examTip":"Play with fire; Play on someone's emotions."},{"category":"verb","word":"Prefer","prep":"to","pair":"Prefer to","hindi":"की तुलना में अधिक पसंद करना","example":"I prefer tea to coffee.","examTip":"Prefer A to B (never 'prefer than')."},{"category":"verb","word":"Present","prep":"at / to / with","pair":"Present at / to / with","hindi":"प्रस्तुत करना (at) / उपहार देना (to/with)","example":"He presented the cheque at the bank. He presented a mobile to her. He presented her with a mobile.","examTip":"Present something to someone / Present someone with something."},{"category":"verb","word":"Preserve","prep":"from","pair":"Preserve from","hindi":"से सुरक्षित रखना / बचाना","example":"God preserves us from all evils.","examTip":"Preserve from decay / danger."},{"category":"verb","word":"Preside","prep":"at / over","pair":"Preside at / over","hindi":"की अध्यक्षता करना","example":"She presided over the meeting.","examTip":"Preside over a conference."},{"category":"verb","word":"Press","prep":"upon","pair":"Press upon","hindi":"पर थोपना / दबाव डालना","example":"You should not press your views upon us.","examTip":"Press ideas upon others."},{"category":"verb","word":"Prevail","prep":"upon / over","pair":"Prevail upon (persuade) / over (triumph)","hindi":"राजी करना (upon) / विजयी होना (over)","example":"He prevailed upon his father to go there. We will definitely prevail over our opponents.","examTip":"Prevail upon someone to do something; Prevail over enemies."},{"category":"verb","word":"Prevent","prep":"from","pair":"Prevent from","hindi":"से रोकना / बाधा डालना","example":"He prevented me from entering the hall.","examTip":"Prevent + Object + from + Gerund."},{"category":"verb","word":"Profit","prep":"by","pair":"Profit by","hindi":"गलतियों या अनुभव से लाभ उठाना","example":"You profit by the mistakes of others.","examTip":"Profit by experience."},{"category":"verb","word":"Prohibit","prep":"from","pair":"Prohibi :"at / over","pair":"Rejoice at / over","hindi":"पर खुशियां मनाना / आनंदित होना","example":"Let's rejoice over the victory.","examTip":"Rejoice at/over good news."},{"category":"verb","word":"Relieve","prep":"of","pair":"Relieve of","hindi":"दर्द या पद से मुक्त करना","example":"This will relieve you of pain. I was relieved of my post.","examTip":"Relieve someone of responsibility / duties."},{"category":"verb","word":"Rely","prep":"on","pair":"Rely on","hindi":"पर भरोसा / निर्भर रहना","example":"I do not rely on anybody.","examTip":"Rely on / upon someone."},{"category":"verb","word":"Remind","prep":"of","pair":"Remind of","hindi":"की याद दिलाना","example":"I remind you of your promise.","examTip":"Remind someone of something."},{"category":"verb","word":"Repent","prep":"of","pair":"Repent of","hindi":"पर पश्चाताप करना","example":"He need not repent of what he has done.","examTip":"Repent of sins / wrongdoing."},{"category":"verb","word":"Resolve","prep":"on","pair":"Resolve on","hindi":"का दृढ़ संकल्प करना","example":"He resolved on doing it.","examTip":"Resolve on + Gerund."},{"category":"verb","word":"Rest","prep":"with","pair":"Rest with","hindi":"पर निर्भर करना / के हाथ में निर्णय होना","example":"It rests with her to decide what to do in this case.","examTip":"The decision rests with the committee."},{"category":"verb","word":"Revenge","prep":"on","pair":"Revenge on","hindi":"से प्रतिशोध / बदला लेना","example":"He revenged himself on her for misbehaving with his brother.","examTip":"Revenge oneself on someone for something."},{"category":"verb","word":"Reward","prep":"with","pair":"Reward with","hindi":"से पुरस्कृत करना","example":"I rewarded her with a mobile.","examTip":"Reward with a medal / cash prize."},{"category":"verb","word":"Rule","prep":"over","pair":"Rule over","hindi":"पर शासन करना","example":"You will rule over the country.","examTip":"Rule over a kingdom / empire."},{"category":"verb","word":"Save","prep":"from","pair":"Save from","hindi":"से बच t to authority / destiny."},{"category":"verb","word":"Subscribe","prep":"to","pair":"Subscribe to","hindi":"अंशदान देना / सदस्यता लेना","example":"I subscribed Rs. 5000 to the relief fund.","examTip":"Subscribe to a fund / magazine / view."},{"category":"verb","word":"Succeed","prep":"to","pair":"Succeed to","hindi":"का उत्तराधिकारी बनना","example":"Akbar succeeded to the throne at the age of thirteen.","examTip":"Succeed to the estate / throne."},{"category":"verb","word":"Supply","prep":"to / with","pair":"Supply to ... / with ...","hindi":"आपूर्ति करना","example":"I supply clothes to the army camp. He supplied us with food and clothes.","examTip":"Supply goods to someone; Supply someone with goods."},{"category":"verb","word":"Sympathize","prep":"with","pair":"Sympathize with","hindi":"के साथ सहानुभूति प्रकट करना","example":"He sympathized with me.","examTip":"Sympathize with the victims."},{"category":"verb","word":"Talk","prep":"of / about / to","pair":"Talk of / about / to","hindi":"चर्चा करना / बात करना","example":"I was talking about the movie. She was talking to her friend.","examTip":"Talk about a topic; Talk to a companion."},{"category":"verb","word":"Throw","prep":"at","pair":"Throw at","hindi":"पर निशाना लगाकर फेंकना","example":"He threw stones at me.","examTip":"Throw at (आघात करने के इरादे से फेंकना); Throw to (पकड़ने के लिए फेंकना - e.g. throw the ball to him)."},{"category":"verb","word":"Treat","prep":"of / with","pair":"Treat of / with","hindi":"का विषय होना (of) / से व्यवहार करना (with)","example":"This book treats of all crucial issues. He treated with us in a friendly manner.","examTip":"A book treats of philosophy; Treat with courtesy."},{"category":"verb","word":"Triumph","prep":"over","pair":"Triumph over","hindi":"पर विजय प्राप्त करना","example":"Good must triumph over evil.","examTip":"Triumph over adversity / enemies."},{"category":"verb","word":"Trust","prep":"in","pair":"Trust in","hindi":"में भरोसा / विश्वास रखना","example":"Trust in the goodness of human nature.","examTip":"Trust in God and do the right."},{"category":"verb","word":"Wait","prep":"on / for","pair":"Wait on / for","hindi":"सेवा में उपस्थित रहना (on) / प्रतीक्षा करना (for)","example":"All his maids waited on him. We are waiting for the doctor.","examTip":"Wait on (सेवा सत्कार करना); Wait for (इंतज़ार करना)।"},{"category":"verb","word":"Warn","prep":"against / of","pair":"Warn against / of","hindi":"से आगाह करना / चेतावनी देना","example":"They warned us of the negative results. He warned me against them.","examTip":"Warn of a danger; Warn against a fraud/person."},{"category":"verb","word":"Wonder","prep":"at / about","pair":"Wonder at / about","hindi":"पर अचंभित होना / सोच-विचार करना","example":"I wonder at your strange behavior. I was wondering about the consequences.","examTip":"Wonder at strange conduct; Wonder about possibilities."},{"category":"verb","word":"Wrestle","prep":"with","pair":"Wrestle with","hindi":"मुश्किलों या चुनौतियों से जूझना","example":"He is still wrestling with difficulties.","examTip":"Wrestle with problems / conscience."},{"category":"verb","word":"Yield","prep":"to","pair":"Yield to","hindi":"के आगे झुकना / हार मान लेना","example":"He yielded to temptation.","examTip":"Yield to pressure / demands."}];
let activeCategory = 'all';
let searchQuery = '';
let onlyBookmarks = false;
let bookmarks = JSON.parse(localStorage.getItem('prep_bookmarks') || '[]');

document.addEventListener('DOMContentLoaded', () => {
  renderCards();
  updateBookmarkCount();
  lucide.createIcons();
});

// THEME
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon(next);
}

function updateThemeIcon(theme) {
  const icon = document.getElementById('themeIcon');
  const text = document.getElementById('themeText');
  if (theme === 'light') {
    icon.setAttribute('data-lucide', 'sun');
    text.textContent = 'Light';
  } else {
    icon.setAttribute('data-lucide', 'moon');
    text.textContent = 'Dark';
  }
  lucide.createIcons();
}

// FILTER
function filterCategory(cat) {
  activeCategory = cat;
  onlyBookmarks = false;
  document.querySelectorAll('.category-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
  const targetBtn = document.getElementById('tab-' + cat);
  if (targetBtn) targetBtn.classList.add('active');
  renderCards();
}

function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  renderCards();
}

function showOnlyBookmarks() {
  onlyBookmarks = !onlyBookmarks;
  renderCards();
  showToast(onlyBookmarks ? "Showing bookmarked pairs" : "Showing all pairs");
}

function resetFilters() {
  activeCategory = 'all';
  searchQuery = '';
  onlyBookmarks = false;
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.category-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('tab-all').classList.add('active');
  renderCards();
}

// RENDER
function renderCards() {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';

  const filtered = data.filter(item => {
    if (activeCategory !== 'all' && item.category !== activeCategory) return false;
    if (onlyBookmarks && !bookmarks.includes(item.pair)) return false;
    if (searchQuery) {
      const matchPair = item.pair.toLowerCase().includes(searchQuery);
      const matchHindi = item.hindi.toLowerCase().includes(searchQuery);
      const matchEx = item.example.toLowerCase().includes(searchQuery);
      const matchTip = item.examTip.toLowerCase().includes(searchQuery);
      if (!matchPair && !matchHindi && !matchEx && !matchTip) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px 20px; background:var(--bg-card); border-radius:16px; border:1px dashed var(--border-color);">' +
      '<i data-lucide="search-x" style="width:48px; height:48px; color:var(--accent-primary); margin-bottom:12px;"></i>' +
      '<h3>No preposition pairs match your search criteria</h3>' +
      '<button class="btn-action" style="margin-top:14px;" onclick="resetFilters()">Reset All Filters</button>' +
    '</div>';
    lucide.createIcons();
    return;
  }

  filtered.forEach((item, index) => {
    const card = document.createElement('article');
    card.className = 'prep-card';
    const isFav = bookmarks.includes(item.pair);

    let catClass = 'cat-noun';
    let catText = 'Noun';
    if (item.category === 'adjective') { catClass = 'cat-adjective'; catText = 'Adjective / Participle'; }
    if (item.category === 'verb') { catClass = 'cat-verb'; catText = 'Verb'; }

    // Highlight preposition in example sentence
    const highlightedEx = highlightPreposition(item.example, item.prep);

    card.innerHTML = 
      '<div class="card-head">' +
        '<div>' +
          '<div class="word-title">' +
            '<span>' + item.word + '</span>' +
            '<span class="prep-highlight">' + item.prep + '</span>' +
          '</div>' +
          '<span class="cat-badge ' + catClass + '" style="margin-top:6px; display:inline-block;">' + catText + '</span>' +
        '</div>' +
        '<div style="display:flex; align-items:center; gap:6px;">' +
          '<button class="icon-btn" title="Speak Example" onclick="speakText(\'' + escapeQuotes(item.example) + '\')">' +
            '<i data-lucide="volume-2"></i>' +
          '</button>' +
          '<button class="icon-btn ' + (isFav ? 'active-fav' : '') + '" title="Bookmark" onclick="toggleBookmark(\'' + escapeQuotes(item.pair) + '\', this)">' +
            '<i data-lucide="bookmark"></i>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="hindi-meaning">🎯 ' + item.hindi + '</div>' +
      '<div class="example-box">📝 <strong>Ex:</strong> ' + highlightedEx + '</div>' +
      (item.examTip ? '<div class="exam-tip-box"><i data-lucide="lightbulb"></i> <span><strong>Exam Note:</strong> ' + item.examTip + '</span></div>' : '') +
      '<div class="card-footer">' +
        '<span style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted);">#' + (index + 1) + '</span>' +
        '<button class="icon-btn" style="font-size:12px; gap:4px;" onclick="copyText(\'' + escapeQuotes(item.pair + ' - ' + item.hindi) + '\')"><i data-lucide="copy" style="width:14px;height:14px;"></i> Copy</button>' +
      '</div>';

    container.appendChild(card);
  });

  lucide.createIcons();
}

function highlightPreposition(sentence, prep) {
  if (!sentence || !prep) return sentence;
  const parts = prep.split(/[/,]/).map(p => p.trim());
  let result = sentence;
  parts.forEach(p => {
    const reg = new RegExp('\\b(' + p + ')\\b', 'gi');
    result = result.replace(reg, '<strong>$1</strong>');
  });
  return result;
}

// BOOKMARKS
function toggleBookmark(pair, btn) {
  const idx = bookmarks.indexOf(pair);
  if (idx > -1) {
    bookmarks.splice(idx, 1);
    btn.classList.remove('active-fav');
    showToast("Removed from bookmarks");
  } else {
    bookmarks.push(pair);
    btn.classList.add('active-fav');
    showToast("Saved to bookmarks ⭐");
  }
  localStorage.setItem('prep_bookmarks', JSON.stringify(bookmarks));
  updateBookmarkCount();
}

function updateBookmarkCount() {
  document.getElementById('favCount').textContent = bookmarks.length;
}

// AUDIO
function speakText(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
    showToast("🔊 Speaking sentence...");
  }
}

function copyText(txt) {
  navigator.clipboard.writeText(txt);
  showToast("Copied to clipboard!");
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = '<i data-lucide="check-circle"></i> ' + msg;
  lucide.createIcons();
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeQuotes(str) {
  return (str || '').replace(/'/g, "\\'");
}

// QUIZ LOGIC
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;

function startQuiz() {
  // Pick 10 random questions
  const shuffled = [...data].sort(() => 0.5 - Math.random());
  quizQuestions = shuffled.slice(0, 10);
  quizIndex = 0;
  quizScore = 0;

  document.getElementById('quizModal').style.display = 'flex';
  loadQuizQuestion();
  lucide.createIcons();
}

function loadQuizQuestion() {
  const q = quizQuestions[quizIndex];
  document.getElementById('quizCounter').textContent = 'Question ' + (quizIndex + 1) + ' of ' + quizQuestions.length;
  
  // Replace the preposition with blank in the example
  let blankSentence = q.example;
  const parts = q.prep.split(/[/,]/).map(p => p.trim());
  parts.forEach(p => {
    const reg = new RegExp('\\b' + p + '\\b', 'gi');
    blankSentence = blankSentence.replace(reg, '__________');
  });

  document.getElementById('quizQuestion').innerHTML = 'Complete the sentence with the correct preposition:<br><br><span style="color:var(--text-main); font-weight:600;">' + blankSentence + '</span>';
  
  // Generate 4 options
  const correctPrep = parts[0].toLowerCase();
  const pool = ['with', 'to', 'for', 'of', 'in', 'at', 'from', 'on', 'against', 'into', 'by'].filter(p => p !== correctPrep);
  const options = [correctPrep, ...pool.sort(() => 0.5 - Math.random()).slice(0, 3)].sort(() => 0.5 - Math.random());

  const optContainer = document.getElementById('quizOptions');
  optContainer.innerHTML = '';

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt-btn';
    btn.innerHTML = '<span>' + opt.toUpperCase() + '</span> <i data-lucide="circle" style="width:16px;height:16px;"></i>';
    btn.onclick = () => selectQuizAnswer(opt, correctPrep, q);
    optContainer.appendChild(btn);
  });

  document.getElementById('quizFeedback').style.display = 'none';
  document.getElementById('quizNextBtn').style.display = 'none';
  lucide.createIcons();
}

function selectQuizAnswer(chosen, correct, q) {
  const btns = document.querySelectorAll('.quiz-opt-btn');
  btns.forEach(b => {
    b.disabled = true;
    const txt = b.textContent.trim().toLowerCase();
    if (txt === correct) {
      b.classList.add('correct');
      b.innerHTML = '<span>' + txt.toUpperCase() + '</span> <i data-lucide="check-circle" style="width:16px;height:16px;"></i>';
    } else if (txt === chosen) {
      b.classList.add('wrong');
      b.innerHTML = '<span>' + txt.toUpperCase() + '</span> <i data-lucide="x-circle" style="width:16px;height:16px;"></i>';
    }
  });

  const fb = document.getElementById('quizFeedback');
  fb.style.display = 'block';

  if (chosen === correct) {
    quizScore++;
    fb.style.background = 'rgba(16, 185, 129, 0.15)';
    fb.style.border = '1px solid #10b981';
    fb.style.color = '#34d399';
    fb.innerHTML = '🎉 <strong>Correct!</strong> ' + q.pair + ' (' + q.hindi + ')';
  } else {
    fb.style.background = 'rgba(244, 63, 94, 0.15)';
    fb.style.border = '1px solid #f43f5e';
    fb.style.color = '#fb7185';
    fb.innerHTML = '❌ <strong>Incorrect!</strong> Correct answer is <strong>' + q.pair + '</strong> (' + q.hindi + ')';
  }

  document.getElementById('quizNextBtn').style.display = 'inline-flex';
  lucide.createIcons();
}

function nextQuizQuestion() {
  if (quizIndex < quizQuestions.length - 1) {
    quizIndex++;
    loadQuizQuestion();
  } else {
    // Finished
    const fb = document.getElementById('quizFeedback');
    fb.style.display = 'block';
    fb.style.background = 'rgba(6, 182, 212, 0.15)';
    fb.style.border = '1px solid var(--accent-primary)';
    fb.style.color = 'var(--text-main)';
    fb.innerHTML = '<h3>Quiz Completed!</h3><p style="margin-top:8px;">Your final score: <strong>' + quizScore + ' / ' + quizQuestions.length + '</strong></p>';
    document.getElementById('quizOptions').innerHTML = '';
    document.getElementById('quizNextBtn').style.display = 'none';
  }
}

function closeQuiz() {
  document.getElementById('quizModal').style.display = 'none';
}
</script>
